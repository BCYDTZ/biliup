name: Test

on:
  push:
    branches:
      - test
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # biliup-cli 通过 rust-embed 嵌入 out/ 前端产物，需要先构建
      - name: Build frontend
        run: |
          npm install
          node --test npm/tests/*.test.cjs
          node --test app/lib/*.test.cjs
          npm run build
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      # target/ 不再跨运行搬运，避免旧测试二进制/测试残留被复用；只有 master 写入缓存
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # 媒体测试必须使用真实 FFmpeg 和与预览共用的中文字体；XML -> ASS 使用内置 Rust 转换器，
      # 不再安装外部转换器。de_DE 让逗号小数点 Locale 下的转换一致性测试真正运行。
      - name: Install media test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg locales
          sudo locale-gen de_DE.UTF-8
          locale -a | grep -qi de_DE
      # 打印 FFmpeg 版本：切片边界测试对版本敏感，保留此步骤便于后续排查环境差异
      - name: Show FFmpeg version
        run: |
          ffmpeg -version
          ffmpeg -hide_banner -encoders | head -n 20
      - name: Debug FLV+AAC silencedetect on FFmpeg 8.0.1
        run: |
          set -x
          echo "=== 1. 生成 FLV ==="
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i "color=c=gray:s=64x36:r=5:d=240" \
            -f lavfi -i "aevalsrc=0.4*sin(2*PI*440*t)*(between(t\,0\,60)+between(t\,180\,240)):s=44100:d=240" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 25 -keyint_min 25 -sc_threshold 0 \
            -c:a aac -shortest /tmp/live.flv
          echo "=== 2. silencedetect ==="
          ffmpeg -hide_banner -i /tmp/live.flv -vn \
            -af "asetpts=N/SR/TB,aresample=16000,silencedetect=noise=-35dB:d=2" \
            -f null - 2>&1 | grep silence || echo "NO SILENCE DETECTED"
          echo "=== 3. 静音段 RMS ==="
          ffmpeg -hide_banner -i /tmp/live.flv -vn \
            -af "atrim=start=90:end=100,astats=metadata=1:reset=0" \
            -f null - 2>&1 | grep -E "RMS level|Peak level" | head -4
          echo "=== 4. -aac_pns 0 重试 ==="
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i "color=c=gray:s=64x36:r=5:d=240" \
            -f lavfi -i "aevalsrc=0.4*sin(2*PI*440*t)*(between(t\,0\,60)+between(t\,180\,240)):s=44100:d=240" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 25 -keyint_min 25 -sc_threshold 0 \
            -c:a aac -aac_pns 0 -aac_is 0 -aac_coder twoloop -shortest /tmp/live_pns.flv
          ffmpeg -hide_banner -i /tmp/live_pns.flv -vn \
            -af "asetpts=N/SR/TB,aresample=16000,silencedetect=noise=-35dB:d=2" \
            -f null - 2>&1 | grep silence || echo "NO SILENCE WITH -aac_pns 0"
          echo "=== 5. TS+PCM 对照 ==="
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i "color=c=gray:s=64x36:r=5:d=240" \
            -f lavfi -i "aevalsrc=0.4*sin(2*PI*440*t)*(between(t\,0\,60)+between(t\,180\,240)):s=44100:d=240" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 25 -keyint_min 25 -sc_threshold 0 \
            -c:a pcm_s16le -shortest /tmp/live.ts
          ffmpeg -hide_banner -i /tmp/live.ts -vn \
            -af "asetpts=N/SR/TB,aresample=16000,silencedetect=noise=-35dB:d=2" \
            -f null - 2>&1 | grep silence || echo "NO SILENCE IN TS+PCM"
      # 随包字体不进仓库：按固定 SHA-256 取回，缺字体时相关用例会跳过而不是真跑
      - name: Fetch render fonts
        run: |
          dir=crates/biliup-cli/assets/render-tools/fonts
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/NotoSansSC-Regular.otf" 'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf'
          echo "2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b  $dir/NotoSansSC-Regular.otf" | sha256sum -c -
          curl -fsSL --retry 3 -o "$dir/NotoEmoji.ttf" 'https://raw.githubusercontent.com/google/fonts/47d54ca1ebb14fd864695f1d39dc734f39017c33/ofl/notoemoji/NotoEmoji%5Bwght%5D.ttf'
          echo "de6c18832938afc99caf132b39d6a30a19bac7f2e812e28db2535b4608d27551  $dir/NotoEmoji.ttf" | sha256sum -c -
      - name: Run tests
        run: cargo test --locked --workspace

  # 桌面程序是独立 workspace，依赖变动时根 Cargo.lock 会更新，它的锁不会跟着变；
  # desktop-publish.yml 只在发版时跑，漂移要到那时才暴露（v1.2.9 就是这样）
  desktop-lockfile:
    name: Desktop Cargo.lock up to date
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cargo metadata --locked
        run: cargo metadata --locked --format-version 1 --manifest-path tauri-app/src-tauri/Cargo.toml > /dev/null
